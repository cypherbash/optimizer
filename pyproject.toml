[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-context-optimizer"
version = "0.1.0"
description = "Offline-first context selection for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "cypherbash" }]
dependencies = []

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.7"]
yaml = ["PyYAML>=6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
token-optimizer = "token_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
